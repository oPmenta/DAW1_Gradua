spring.application.name=gradua

# ==========================================
# CONEXÃO COM O BANCO (POSTGRESQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/gradua_db
spring.datasource.username=postgres
spring.datasource.password=12345

# ==========================================
# FLYWAY (Gerenciamento de Banco)
# ==========================================
# Habilita o Flyway
spring.flyway.enabled=true

# Importante: Se o banco já tiver tabelas mas não tiver histórico do Flyway,
# isso cria o histórico inicial para evitar erros de "Database not empty".
spring.flyway.baseline-on-migrate=true

# Define onde ficam os arquivos SQL (Padrão: src/main/resources/db/migration)
spring.flyway.locations=classpath:db/migration

# ==========================================
# JPA / HIBERNATE (Modo Passivo)
# ==========================================
# validate: O Hibernate apenas verifica se o Java bate com o Banco.
# Se o Flyway esquecer uma tabela, o Java avisa e para.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# CARGA DE DADOS ANTIGA (Desativada)
# ==========================================
# Como agora usamos o V2__Popular_Banco.sql do Flyway,
# desativamos o data.sql do Spring para não duplicar dados.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ==========================================
# OUTROS AJUSTES
# ==========================================
spring.jpa.open-in-view=true
spring.jpa.properties.jakarta.persistence.validation.mode=none