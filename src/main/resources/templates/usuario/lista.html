<!DOCTYPE html>
<html lang="pt-BR" layout:decorate="~{layout/layoutpadrao}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alunos</title>
</head>
<body>
    <main layout:fragment="conteudo">
        <div class="container mx-auto p-6">
            <h1 class="text-3xl font-bold mb-6 text-gray-700">Alunos Cadastrados</h1>

            <div class="overflow-x-auto relative shadow-md sm:rounded-lg">
                <table class="w-full text-sm text-left text-gray-500">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                        <tr>
                            <th scope="col" class="py-3 px-6">ID</th>
                            <th scope="col" class="py-3 px-6">Nome</th>
                            <th scope="col" class="py-3 px-6">Email</th>
                            <th scope="col" class="py-3 px-6">Tipo</th>
                            <th scope="col" class="py-3 px-6">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="usuario : ${usuarios}" class="bg-white border-b hover:bg-gray-50">
                            <td class="py-4 px-6" th:text="${usuario.id}">1</td>
                            <td class="py-4 px-6 font-medium text-gray-900 whitespace-nowrap" th:text="${usuario.nome}">Nome</td>
                            <td class="py-4 px-6" th:text="${usuario.email}">email@teste.com</td>
                            <td class="py-4 px-6">
                                <span th:class="${usuario.tipo == 'ADMIN' ? 'bg-red-100 text-red-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded' : 'bg-green-100 text-green-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded'}" 
                                      th:text="${usuario.tipo}">PADRAO</span>
                            </td>
                            <td class="py-4 px-6">
                                <a href="#" class="font-medium text-blue-600 hover:underline">Editar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="mt-4">
                <a href="/" class="text-blue-500 hover:underline">← Voltar para Início</a>
            </div>
        </div>
    </main>
</body>
</html>
