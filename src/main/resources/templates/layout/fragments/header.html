<div th:fragment="header">
    <header class="flex items-center justify-between bg-gray-800 p-4 shadow-lg border-b border-gray-700">

        <div>
            <div class="md:hidden">
                <button id="menu-btn" type="button"
                    class="hamburger z-40 block focus:outline-none md:hidden text-gray-300">
                    <span class="hamburger-top"></span>
                    <span class="hamburger-middle"></span>
                    <span class="hamburger-bottom"></span>
                </button>
            </div>

            <a th:href="@{/}" class="flex items-center space-x-3">
                <div class="text-xl font-bold text-white tracking-wide md:text-3xl">
                    Gradua <span class="text-blue-400 text-sm align-top">Beta</span>
                </div>
            </a>
        </div>

        <div class="hidden items-center md:flex space-x-4">

            <form th:if="${todosUsuarios != null}" th:action="@{/simulados/selecionar-usuario}" method="post"
                class="flex items-center space-x-2">
                <label class="text-xs text-gray-400">Login:</label>
                <select name="usuarioId" onchange="this.form.submit()"
                    class="rounded bg-gray-700 text-white text-xs p-1">
                    <option value="0">Visitante</option>
                    <option th:each="user : ${todosUsuarios}" th:value="${user.idUsuario}" th:text="${user.nome}"
                        th:selected="${session.usuarioLogado != null && session.usuarioLogado.idUsuario == user.idUsuario}">
                    </option>
                </select>
            </form>

            <div class="text-sm text-gray-300 md:text-xl border-l pl-4 border-gray-600">
                <span th:if="${session.usuarioLogado != null}"
                    th:text="'Bem-vindo, ' + ${session.usuarioLogado.nome}">Bem-vindo!</span>
                <span th:unless="${session.usuarioLogado != null}">Acesso Livre (Visitante)</span>
            </div>
        </div>

        <div class="mr-1 text-gray-300 md:hidden">
            <button id="menu-usuario-btn" type="button" class="block focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor"
                    class="bi bi-person-circle" viewBox="0 0 16 16">
                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
                    <path fill-rule="evenodd"
                        d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z" />
                </svg>
            </button>
        </div>

    </header>

    <div id="menu"
        class="absolute bottom-0 left-0 top-0 hidden min-h-screen w-full flex-col space-y-3 self-end bg-gray-900 py-1 pl-12 pt-40 text-lg text-gray-400 opacity-95 z-30">
        <th:block th:replace="~{layout/fragments/menu :: menu}"></th:block>
    </div>

    <div id="menu-usuario"
        class="absolute bottom-0 left-0 top-0 hidden min-h-screen w-full flex-col items-end space-y-3 self-end bg-gray-900 py-1 pr-12 pt-20 text-lg text-gray-400 opacity-95 z-30">
        <div class="text-white text-xl font-bold mb-4">Área do Aluno</div>

        <div class="text-gray-300"
            th:text="${session.usuarioLogado != null ? session.usuarioLogado.nome : 'Visitante'}">
            Visitante
        </div>

        <a th:href="@{/login}"
            class="w-full text-right rounded-lg border border-blue-500 text-blue-400 px-4 py-2 hover:bg-blue-600 hover:text-white transition">
            Login </a>
        <a th:href="@{/cadastro}"
            class="w-full text-right rounded-lg border border-green-500 text-green-400 px-4 py-2 hover:bg-green-600 hover:text-white transition">
            Criar Conta </a>
    </div>
</div>
