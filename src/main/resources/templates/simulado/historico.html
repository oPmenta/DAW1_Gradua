<!DOCTYPE html>
<html lang="pt-BR" layout:decorate="~{layout/layoutpadrao}" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8" />
    <title>Meus Simulados</title>
</head>
<body>
    <main layout:fragment="conteudo" class="flex flex-col items-center w-full pt-8 px-4">
        <h1 class="text-3xl font-bold text-blue-600 mb-6">Meus Simulados</h1>
        <div class="w-full max-w-5xl shadow-xl rounded-2xl bg-white border border-gray-200">
            <table class="w-full text-left border-collapse">
                <thead class="bg-blue-600 text-white">
                    <tr>
                        <th class="p-4 w-1/3">Simulado</th>
                        <th class="p-4">Data</th>
                        <th class="p-4 text-center">Pontos</th>
                        <th class="p-4 text-center">Ações</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <tr th:each="res : ${resultados}" class="hover:bg-blue-50">
                        <td class="p-4 font-medium" th:text="${res.simulado.titulo}"></td>
                        <td class="p-4" th:text="${#temporals.format(res.realizadoEm, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="p-4 text-center font-bold text-blue-600" th:text="${res.pontuacao}"></td>
                        
                        <td class="p-4 flex justify-center gap-2">
                            
                            <a th:href="@{/simulados/resultado/{id}/pdf(id=${res.id})}" target="_blank"
                               class="bg-red-500 text-black px-3 py-2 rounded font-bold text-xs">GERAR PDF</a>

                            <a th:href="@{/simulados/editar/{id}(id=${res.id})}" 
                               class="bg-yellow-400 text-yellow-900 px-3 py-2 rounded font-bold text-xs">EDITAR</a>

                            <form th:action="@{/simulados/excluir/{id}(id=${res.id})}" method="post" 
                                  onsubmit="return confirm('Apagar mesmo?');" class="m-0">
                                <button type="submit" class="bg-gray-200 text-red-600 px-3 py-2 rounded font-bold text-xs">🗑️</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <a th:href="@{/}" class="mt-8 text-blue-600 hover:underline">← Voltar</a>
    </main>
</body>
</html>
