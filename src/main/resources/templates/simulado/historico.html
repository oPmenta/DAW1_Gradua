<!DOCTYPE html>
<html lang="pt-BR" layout:decorate="~{layout/layoutpadrao}" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8" />
    <title>Gradua - Meus Relatórios</title>
</head>

<body>
    <main layout:fragment="conteudo" class="flex flex-col items-center w-full pt-8 px-4">

        <h1 class="text-3xl font-bold text-blue-600 mb-6">Meus Simulados Realizados</h1>

        <div class="w-full max-w-4xl overflow-hidden shadow-xl rounded-2xl bg-white border border-gray-200">
            <table class="w-full text-left border-collapse">
                <thead class="bg-blue-600 text-white">
                    <tr>
                        <th class="p-4 font-semibold uppercase text-sm">Simulado</th>
                        <th class="p-4 font-semibold uppercase text-sm">Data</th>
                        <th class="p-4 font-semibold uppercase text-sm text-center">Pontos</th>
                        <th class="p-4 font-semibold uppercase text-sm text-center">Ação</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <tr th:each="res : ${resultados}" class="hover:bg-blue-50 transition-colors">
                        <td class="p-4 text-gray-800 font-medium" th:text="${res.simulado.titulo}">Título</td>
                        <td class="p-4 text-gray-600"
                            th:text="${#temporals.format(res.realizadoEm, 'dd/MM/yyyy HH:mm')}">Data</td>
                        <td class="p-4 text-center font-bold text-blue-600" th:text="${res.pontuacao}">0</td>
                        <td class="p-4 text-center">
                            <a th:href="@{/simulados/resultado/{id}/pdf(id=${res.id})}" target="_blank"
                                class="bg-red-500 hover:bg-red-600 text-black px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-sm">
                                GERAR PDF
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(resultados)}">
                        <td colspan="4" class="p-12 text-center text-gray-400 italic">
                            Você ainda não completou nenhum simulado.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a th:href="@{/}" class="mt-8 text-blue-600 hover:underline font-medium">
            ← Voltar para o Início
        </a>
    </main>
</body>

</html>
