<!DOCTYPE html>
<html lang="pt-BR" layout:decorate="~{layout/layoutpadrao}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resolvendo Simulado</title>
</head>
<body>
    <main layout:fragment="conteudo">
        <div class="container mx-auto p-6 max-w-4xl">
            
            <div class="mb-8 border-b pb-4">
                <h1 class="text-3xl font-bold text-gray-800" th:text="${simulado.titulo}">Título do Simulado</h1>
                <p class="text-gray-600 mt-2">Leia com atenção e responda todas as questões.</p>
            </div>

            <form method="POST" th:action="@{/simulados/finalizar}">
                
                <div th:each="questao, i : ${questoesSorteada}" class="bg-white p-6 rounded-lg shadow-md mb-8 border border-gray-200">
                    
                    <div class="flex justify-between items-center mb-4">
                        <span class="bg-blue-600 text-white text-sm font-bold px-3 py-1 rounded-full" 
                              th:text="'Questão ' + ${i.count}">Questão 1</span>
                        <span class="text-sm text-gray-500 font-semibold" th:text="${questao.materia}">Matéria</span>
                    </div>

                    <p class="text-gray-800 text-lg mb-4 leading-relaxed whitespace-pre-wrap" th:text="${questao.enunciado}">
                        Texto do enunciado aqui...
                    </p>

                    <div th:if="${questao.imagemUrl != null and #strings.length(questao.imagemUrl) > 0}" class="mb-6 flex justify-center">
                        <img th:src="@{'/' + ${questao.imagemUrl}}" 
                             class="max-h-96 rounded border shadow-sm" alt="Imagem da questão">
                    </div>

                    <div class="space-y-3 mt-4">
                        <label class="flex items-start p-3 border rounded hover:bg-blue-50 cursor-pointer transition">
                            <input type="radio" th:name="'resposta_' + ${questao.id}" value="A" required class="mt-1 mr-3 w-4 h-4 text-blue-600">
                            <span class="text-gray-700"><strong class="mr-2">A)</strong> <span th:text="${questao.alternativaA}">Texto A</span></span>
                        </label>

                        <label class="flex items-start p-3 border rounded hover:bg-blue-50 cursor-pointer transition">
                            <input type="radio" th:name="'resposta_' + ${questao.id}" value="B" required class="mt-1 mr-3 w-4 h-4 text-blue-600">
                            <span class="text-gray-700"><strong class="mr-2">B)</strong> <span th:text="${questao.alternativaB}">Texto B</span></span>
                        </label>

                        <label class="flex items-start p-3 border rounded hover:bg-blue-50 cursor-pointer transition">
                            <input type="radio" th:name="'resposta_' + ${questao.id}" value="C" required class="mt-1 mr-3 w-4 h-4 text-blue-600">
                            <span class="text-gray-700"><strong class="mr-2">C)</strong> <span th:text="${questao.alternativaC}">Texto C</span></span>
                        </label>

                        <label class="flex items-start p-3 border rounded hover:bg-blue-50 cursor-pointer transition">
                            <input type="radio" th:name="'resposta_' + ${questao.id}" value="D" required class="mt-1 mr-3 w-4 h-4 text-blue-600">
                            <span class="text-gray-700"><strong class="mr-2">D)</strong> <span th:text="${questao.alternativaD}">Texto D</span></span>
                        </label>

                        <label class="flex items-start p-3 border rounded hover:bg-blue-50 cursor-pointer transition">
                            <input type="radio" th:name="'resposta_' + ${questao.id}" value="E" required class="mt-1 mr-3 w-4 h-4 text-blue-600">
                            <span class="text-gray-700"><strong class="mr-2">E)</strong> <span th:text="${questao.alternativaE}">Texto E</span></span>
                        </label>
                    </div>
                </div>

                <div class="text-center mt-8 mb-12">
                    <button type="submit" class="bg-green-600 text-white text-xl font-bold py-3 px-12 rounded-lg hover:bg-green-700 shadow-lg transition transform hover:scale-105">
                        FINALIZAR SIMULADO
                    </button>
                </div>

            </form>
        </div>
    </main>
</body>
</html>
