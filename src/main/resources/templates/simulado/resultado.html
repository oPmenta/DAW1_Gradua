<!DOCTYPE html>
<html lang="pt-BR" layout:decorate="~{layout/layoutpadrao}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultado do Simulado</title>
</head>
<body>
    <main layout:fragment="conteudo">
        <div class="container mx-auto p-6 max-w-2xl text-center mt-10">
            
            <div class="bg-white p-8 rounded-xl shadow-2xl border border-gray-200">
                <div class="text-6xl mb-4">🏆</div>
                
                <h1 class="text-4xl font-bold text-gray-800 mb-6">Simulado Finalizado!</h1>
                
                <div class="mb-8">
                    <p class="text-xl text-gray-600">Você acertou:</p>
                    <div class="text-5xl font-extrabold text-blue-600 mt-2">
                        <span th:text="${acertos}">0</span> / <span th:text="${total}">8</span>
                    </div>
                </div>

                <div class="p-4 bg-gray-50 rounded-lg mb-8">
                    <p th:if="${acertos == 8}" class="text-green-600 font-bold">Incrível! Você gabaritou! 🌟</p>
                    <p th:if="${acertos >= 5 and acertos < 8}" class="text-blue-600 font-bold">Muito bom! Continue assim. 🚀</p>
                    <p th:if="${acertos < 5}" class="text-orange-600 font-bold">Bom treino! Vamos estudar mais um pouco? 📚</p>
                </div>

                <a th:href="@{/}" class="inline-block bg-blue-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700 transition shadow">
                    Voltar para a Página Inicial
                </a>
            </div>

        </div>
    </main>
</body>
</html>
