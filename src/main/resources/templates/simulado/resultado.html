<!DOCTYPE html>
<html lang="pt-BR" layout:decorate="~{layout/layoutpadrao}" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Resultado do Simulado</title>
</head>

<body>
    <main layout:fragment="conteudo" class="flex flex-col items-center p-10">
        <h1 class="text-4xl font-bold text-blue-600">Fim do Simulado!</h1>

        <div class="mt-8 bg-gray-100 p-8 rounded-2xl shadow-md text-center w-96">
            <p class="text-2xl">Acertos: <span class="font-bold text-green-600" th:text="${acertos}">0</span></p>
            <p class="text-2xl">Erros: <span class="font-bold text-red-600" th:text="${erros}">0</span></p>
            <hr class="my-4">
            <p class="text-3xl font-bold">Pontuação:
                <span th:text="${pontuacao}" th:class="${pontuacao >= 0 ? 'text-blue-600' : 'text-orange-600'}">0</span>
            </p>
        </div>

        <div th:if="${isVisitante}" class="text-center mt-6">
            <p class="text-red-500 mb-4 font-medium">Modo Visitante: Este resultado não foi salvo no ranking.</p>
            <a th:href="@{/}" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition">
                Voltar ao Início
            </a>
        </div>

        <div th:unless="${isVisitante}" class="flex flex-col items-center mt-8 w-full">
            
            <div class="flex gap-4 mb-6">
                <a th:href="@{/simulados/resultado/{id}/pdf(id=${resultado.id})}"
                    class="bg-green-600 text-white px-6 py-3 rounded-lg font-bold shadow-md hover:bg-green-700 transition flex items-center gap-2">
                    Baixar PDF
                </a>
                
                <a th:href="@{/simulados/historico}" 
                   class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold shadow-md hover:bg-blue-700 transition flex items-center gap-2">
                   Ver Histórico de simulados
                </a>
            </div>

            <a th:href="@{/}" class="text-gray-500 hover:text-blue-600 hover:underline transition font-medium">
                ← Voltar para a Página Inicial
            </a>
        </div>
    </main>
</body>

</html>
