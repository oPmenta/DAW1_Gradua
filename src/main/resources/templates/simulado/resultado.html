<!DOCTYPE html>
<html lang="pt-BR" layout:decorate="~{layout/layoutpadrao}" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Resultado do Simulado</title>
</head>

<body>
    <main layout:fragment="conteudo" class="flex flex-col items-center p-10">
        <h1 class="text-4xl font-bold text-blue-600">Fim do Simulado!</h1>

        <div class="mt-8 bg-gray-100 p-8 rounded-2xl shadow-md text-center w-96">
            <p class="text-2xl">Acertos: <span class="font-bold text-green-600" th:text="${acertos}">0</span></p>
            <p class="text-2xl">Erros: <span class="font-bold text-red-600" th:text="${erros}">0</span></p>
            <hr class="my-4">
            <p class="text-3xl font-bold">Pontuação:
                <span th:text="${pontuacao}" th:class="${pontuacao >= 0 ? 'text-blue-600' : 'text-orange-600'}">0</span>
            </p>
        </div>

        <a th:href="@{/}" class="mt-10 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
            Voltar ao Início
        </a>
    </main>
</body>

</html>
