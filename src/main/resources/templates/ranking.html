<!DOCTYPE html>
<html lang="pt-BR" layout:decorate="~{layout/layoutpadrao}" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <title>Ranking Gradua</title>
</head>

<body>
    <main layout:fragment="conteudo" class="flex flex-col items-center w-full pt-4">
        <h1 class="text-3xl font-bold text-yellow-600 mb-8">🏆 Ranking de Estudantes</h1>

        <div class="w-full max-w-2xl bg-gray-100 rounded-2xl shadow-lg border-2 border-yellow-100 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-blue-600 text-white">
                    <tr>
                        <th class="p-4 text-center">Posição</th>
                        <th class="p-4">Estudante</th>
                        <th class="p-4 text-center">Pontuação Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user, iter : ${ranking}"
                        class="border-b border-gray-200 hover:bg-blue-50 transition-colors">
                        <td class="p-4 text-center font-bold text-xl" th:text="${iter.count} + 'º'">1º</td>
                        <td class="p-4 text-lg" th:text="${user.nome}">Nome do Usuário</td>
                        <td class="p-4 text-center font-bold text-blue-900 text-xl"
                            th:text="${#aggregates.sum(user.resultados.![pontuacao]) ?: 0}">0</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a th:href="@{/}" class="mt-10 text-blue-600 hover:underline">← Voltar para o início</a>
    </main>
</body>

</html>
